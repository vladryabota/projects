<div
  class="group relative bg-gray-900 rounded-xl overflow-hidden shadow-lg transform transition-all duration-300 hover:scale-105"
>
  <div class="relative aspect-[2/3]">
    <img
      [src]="movie.Poster !== 'N/A' ? movie.Poster : 'https://via.placeholder.com/400x600'"
      [alt]="movie.Title"
      class="w-full h-full object-cover group-hover:opacity-70"
    />
    <div class="absolute inset-0 bg-gradient-to-t from-black opacity-60"></div>
  </div>
  <div class="p-4 bg-gray-900">
    <h3 class="text-white font-semibold truncate">{{ movie.Title }}</h3>
    <p class="text-gray-400 text-xs mb-4">{{ movie.Year }}</p>
    <div class="flex gap-2">
      <button
        (click)="toggle.emit(movie.imdbID)"
        [class]="
          isFavorite ? 'bg-red-600 flex-1 py-2 rounded-lg' : 'bg-gray-800 flex-1 py-2 rounded-lg'
        "
      >
        {{ isFavorite ? '❤️' : '🤍 Favorites' }}
      </button>
      <a
        [routerLink]="['/movie', movie.imdbID]"
        class="flex-1 text-center bg-blue-600 py-2 rounded-lg text-sm font-bold"
        >Details</a
      >
    </div>
  </div>
</div>
