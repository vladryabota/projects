<div class="pt-24 min-h-screen bg-black text-white">
  <div class="max-w-7xl mx-auto px-4">
    <header class="mb-8 text-center">
      <h1
        class="text-6xl font-black mb-8 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-indigo-600 italic"
      >
        Cinema Hub
      </h1>

      <div class="relative max-w-2xl mx-auto mb-8">
        <input
          [(ngModel)]="query"
          (keyup.enter)="fetchMovies()"
          placeholder="Search movies..."
          class="w-full bg-gray-900/50 border border-gray-800 p-5 rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 text-white text-lg transition-all"
        />
        <button
          (click)="fetchMovies()"
          class="absolute right-3 top-3 bg-blue-600 px-8 py-2.5 rounded-xl font-bold hover:bg-blue-500 transition-all shadow-lg shadow-blue-600/20"
        >
          Search
        </button>
      </div>

      <div class="flex justify-center gap-3 mb-6">
        @for (f of filters; track f.value) {
          <button
            (click)="setType(f.value)"
            [class]="
              type === f.value
                ? 'bg-blue-600 px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest'
                : 'bg-gray-900 border border-gray-800 px-6 py-2 rounded-full text-xs font-black uppercase tracking-widest text-gray-400 hover:border-gray-600'
            "
          >
            {{ f.label }}
          </button>
        }
      </div>

      <div
        class="flex flex-col md:flex-row justify-between items-center bg-gray-900/30 p-4 rounded-2xl border border-gray-800/50 mb-8"
      >
        <p class="text-gray-500 font-mono text-sm uppercase tracking-widest mb-4 md:mb-0">
          Results: {{ totalResults }}
        </p>

        @if (totalPages > 1) {
          <div class="flex items-center gap-6">
            <button
              [disabled]="page === 1"
              (click)="changePage(-1)"
              class="text-gray-500 hover:text-white disabled:opacity-10 font-black uppercase text-xs transition-all italic"
            >
              PREV
            </button>

            <div class="flex items-center gap-3">
              <span class="text-blue-500 font-black italic">{{ page }}</span>
              <span class="text-gray-700">/</span>
              <span class="text-gray-500 text-sm">{{ totalPages }}</span>
            </div>

            <button
              [disabled]="page === totalPages"
              (click)="changePage(1)"
              class="text-gray-500 hover:text-white disabled:opacity-10 font-black uppercase text-xs transition-all italic"
            >
              NEXT
            </button>
          </div>
        }
      </div>
    </header>

    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-8 mb-20">
      @for (movie of movies(); track movie.imdbID) {
        <app-movie-card
          [movie]="movie"
          [isFavorite]="movieService.favorites().includes(movie.imdbID)"
          (toggle)="movieService.toggleFavorite($event)"
        >
        </app-movie-card>
      }
    </div>
  </div>
</div>
